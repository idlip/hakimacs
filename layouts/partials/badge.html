{{- /* render simple badge with logo and text with link */ -}}
{{- $tooltip := .tooltip | default (print .subtitle " " .name) -}}
<a href="{{ .link | default "#" }}" class="badge rain-hover" title="{{ $tooltip }}"
  {{- with $.color }}
        style="border:1px solid {{ . }}"
  {{- end }}
>
  <span class="badge-icon">
    <img src="{{ .logo }}" alt="{{ .name | default "" }}" loading="lazy" />
  </span>
  {{- with .subtitle }}
    <span class="badge-subtitle">{{ . }}</span>
  {{- end }}
  {{- with .name }}
    <span
      class="badge-name"
      {{- with $.color }}
        style="background:{{ . }}"
      {{- end }}
      >{{ . }}</span
    >
  {{- end }}
  {{ partial "rain-spans.html" . }}
</a>
